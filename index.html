    <title>Squad REN</title>
    <!-- Kill any stale service workers BEFORE modules load.
         A lingering SW from Firebase Hosting intercepts JS files and serves
         them with the wrong MIME type, preventing module scripts from loading.
         This plain script runs synchronously before any <script type="module">. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
